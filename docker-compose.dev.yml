services:
  meetup:
    build: .
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://fgc:devpassword@postgres:5432/fgc_checkin
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
    networks:
      - fgt-network

networks:
  fgt-network:
    external: true
    name: fgt-dev_fgt-net
