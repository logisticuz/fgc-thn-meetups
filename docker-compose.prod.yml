services:
  meetup:
    build: .
    ports:
      - "8004:8000"
    env_file:
      - .env
    environment:
      - N8N_URL=http://n8n:5678
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/kiosk')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - fgt-net

networks:
  fgt-net:
    external: true
    name: fgt-checkin-system_fgt-net
